[package]
name = "mdview-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Terminal Markdown viewer with live reload, table of contents, search and syntax highlighting."
keywords = ["markdown", "viewer", "tui", "terminal", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "mdview"
path = "src/main.rs"

[dependencies]
mdview-core = { path = "../mdview-core", version = "0.2.0" }
ratatui = "0.30.0"
crossterm = "0.29.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
notify-debouncer-full = "0.4.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2.2"
dirs = "6"
ratatui-textarea = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5.3.0"
regex = "1"

[dev-dependencies]
tempfile = "3"
