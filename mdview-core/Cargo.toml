[package]
name = "mdview-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Markdown parsing core for mdview: converts Markdown into a structured, serde-serializable document tree (WASM-capable)."
keywords = ["markdown", "parser", "commonmark", "wasm"]
categories = ["text-processing", "parser-implementations", "wasm"]

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
pulldown-cmark = "0.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]

[features]
wasm = ["dep:wasm-bindgen"]
