name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  rust-binaries:
    name: Rust binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p mdview-tui -p mdview-json
      - name: package
        run: |
          staging="mdview-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/mdview" "target/${{ matrix.target }}/release/mdview-json" "$staging/"
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  electron:
    name: Electron (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: electron-wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build zip
        working-directory: mdview-electron
        run: |
          npm ci
          npm run dist:zip
      - name: checksum
        working-directory: mdview-electron/dist
        run: shasum -a 256 mdview-macos-arm64.zip > mdview-macos-arm64.zip.sha256
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mdview-electron/dist/mdview-macos-arm64.zip
            mdview-electron/dist/mdview-macos-arm64.zip.sha256
